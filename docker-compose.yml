# ============================================================================
# AI Engineering Operating System - Docker Compose
# ============================================================================

services:
  # --------------------------------------------------------------------------
  # app - interactive shell or CLI usage
  # --------------------------------------------------------------------------
  app:
    build:
      context: .
      target: runtime
    entrypoint: ["python", "-m", "ai_engineering_os.cli"]
    volumes:
      - ./src:/app/src
      - ./config:/app/config
      - ./agents:/app/agents
      - ./prompts:/app/prompts
      - ./protocol:/app/protocol
      - ./schemas:/app/schemas
      - ./docs:/app/docs
      - ./memory:/app/memory

  # --------------------------------------------------------------------------
  # tests - run full test suite with coverage
  # --------------------------------------------------------------------------
  tests:
    build:
      context: .
      target: runtime
    entrypoint: ["pytest"]
    command: ["-v", "--tb=short", "--cov=ai_engineering_os", "--cov-report=term-missing"]
    volumes:
      - ./src:/app/src
      - ./tests:/app/tests

  # --------------------------------------------------------------------------
  # sonarqube - external quality gate runtime (optional tooling profile)
  # --------------------------------------------------------------------------
  sonarqube:
    image: sonarqube:community
    profiles: ["tooling"]
    ports:
      - "9000:9000"
    environment:
      SONAR_ES_BOOTSTRAP_CHECKS_DISABLE: "true"
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_logs:/opt/sonarqube/logs
      - sonarqube_extensions:/opt/sonarqube/extensions

volumes:
  sonarqube_data:
  sonarqube_logs:
  sonarqube_extensions:
