[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-engineering-os"
version = "0.1.0"
description = "Jarvis integrated AI engineering operating system"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "AI Engineering Team" }]
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "pytest-cov>=5.0.0"
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
